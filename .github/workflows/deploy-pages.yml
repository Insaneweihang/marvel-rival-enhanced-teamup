name: Deploy combined GitHub Pages site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python project dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Python tests
        run: python -m pytest

      - name: Validate patch snapshots
        run: python scripts/validate_patch.py

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install React dependencies
        working-directory: frontend
        run: npm ci
      - name: Build React preview
        working-directory: frontend
        run: npm run build

      - name: Assemble combined site
        run: |
          rm -rf published
          mkdir -p published/react
          cp -R docs/. published/
          cp -R frontend/dist/. published/react/
          mkdir -p published/react/marvel-rivals published/react/tools
          cp published/react/index.html published/react/marvel-rivals/index.html
          cp published/react/index.html published/react/tools/index.html
          touch published/.nojekyll
          test -f published/CNAME
          test -f published/index.html
          test -f published/react/index.html
          test -f published/react/marvel-rivals/index.html
          test -f published/react/tools/index.html
          test -f published/react/data/patches.json
          test -f published/react/games/teamup-path/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: published

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
